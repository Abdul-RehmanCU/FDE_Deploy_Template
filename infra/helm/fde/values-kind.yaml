customer: ci-demo
environment: staging
appVersion: ci
images:
  backend:
    repository: localhost/fde-backend
    tag: ci
    pullPolicy: Never
  frontend:
    repository: localhost/fde-frontend
    tag: ci
    pullPolicy: Never
serviceAccount:
  gcpServiceAccount: ci@example-fde-project.iam.gserviceaccount.com
storage:
  backend: local
  gcsBucket: unused-in-kind
secretProvider:
  enabled: false
  kubernetesSecretName: fde-runtime-secrets
observability:
  enabled: false
