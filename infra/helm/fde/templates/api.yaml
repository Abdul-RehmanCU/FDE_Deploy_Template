apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fde.fullname" . }}-api
  labels:
    {{- include "fde.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  template:
    metadata:
      labels:
        {{- include "fde.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /internal/metrics
        prometheus.io/port: {{ .Values.backend.port | quote }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "fde.backendImage" . }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["fastapi", "run", "app/main.py", "--port", {{ .Values.backend.port | quote }}]
          ports:
            - { name: http, containerPort: {{ .Values.backend.port }}, protocol: TCP }
          env:
            {{- include "fde.backendEnv" . | nindent 12 }}
            - { name: OTEL_SERVICE_NAME, value: fde-api }
          volumeMounts:
            {{- include "fde.secretMount" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        {{- include "fde.secretVolume" . | nindent 8 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fde.fullname" . }}-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
