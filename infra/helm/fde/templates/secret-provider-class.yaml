{{- if .Values.secretProvider.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "fde.fullname" . }}
  labels:
    {{- include "fde.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.databaseUrl }}/versions/latest
        path: database-url
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.redisUrl }}/versions/latest
        path: redis-url
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.appSecretKey }}/versions/latest
        path: secret-key
      {{- if .Values.demoDependencies.enabled }}
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.postgresPassword }}/versions/latest
        path: postgres-password
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.redisPassword }}/versions/latest
        path: redis-password
      {{- end }}
      {{- if eq .Values.profile "managed" }}
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.redisCa }}/versions/latest
        path: redis-ca.pem
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.databaseSslRootCert }}/versions/latest
        path: database-root-ca.pem
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.databaseSslCert }}/versions/latest
        path: database-client-cert.pem
      - resourceName: projects/{{ .Values.secretProvider.projectId }}/secrets/{{ .Values.secretProvider.secretNames.databaseSslKey }}/versions/latest
        path: database-client-key.pem
      {{- end }}
{{- end }}
