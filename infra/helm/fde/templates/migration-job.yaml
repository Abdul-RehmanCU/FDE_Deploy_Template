apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fde.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "fde.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "fde.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: { runAsNonRoot: true, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      {{- if eq .Values.profile "managed" }}
      initContainers:
        {{- include "fde.managedTlsInit" . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "fde.backendImage" . }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "fde.backendEnv" . | nindent 12 }}
            - { name: OTEL_SERVICE_NAME, value: fde-migration }
          volumeMounts:
            {{- include "fde.backendMounts" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        {{- include "fde.secretVolume" . | nindent 8 }}
