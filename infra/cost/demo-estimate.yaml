precluster_phase:
  ceiling_usd: 0.43
  includes:
    - three Scheduler job-months at 0.10 each
    - one billed Workflows internal-step increment at 0.01
    - state and two tiny GCS ownership fixtures at 0.02
    - 0.10 contingency for requests and delayed fixture cleanup
gate:
  passes_estimate_cap: true
  paid_provisioning_allowed: false
  blocked_until:
