name: Bootstrap and expiry guard

on:
  workflow_call:
    inputs:
      project_id: { required: true, type: string }
      customer: { required: true, type: string }
      state_bucket: { required: true, type: string }
      expiry_id: { required: true, type: string }
      expires_at: { required: true, type: string }
    outputs:
      manifest_sha:
        value: ${{ jobs.expiry.outputs.manifest_sha }}
      workflow_name:
        value: ${{ jobs.expiry.outputs.workflow_name }}
      evidence_artifact:
        value: ${{ jobs.expiry.outputs.evidence_artifact }}
  workflow_dispatch:
    inputs:
      project_id:
        description: Dedicated GCP project ID
        required: true
        type: string
      customer:
        description: DNS-safe demo customer slug
        required: true
        default: demo
        type: string
      state_bucket:
        description: Exact labeled Terraform state bucket
        required: true
        type: string
      expiry_id:
        description: Unique cleanup ownership ID
        required: true
        type: string
      expires_at:
        description: Exact UTC minute, at most 3h40m away
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gcp-expiry-${{ inputs.project_id }}-${{ inputs.customer }}
  cancel-in-progress: false

jobs:
  expiry:
    name: Apply and prove independent expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: demo-infrastructure
    permissions:
      contents: read # required to check out the selected revision
      id-token: write # required for keyless GCP Workload Identity Federation
    outputs:
      manifest_sha: ${{ steps.guard.outputs.manifest_sha }}
      workflow_name: ${{ steps.guard.outputs.workflow_name }}
      evidence_artifact: expiry-evidence-${{ github.run_id }}
    env:
      REGION: northamerica-northeast1
      ZONE: northamerica-northeast1-a
      PROJECT_ID: ${{ inputs.project_id }}
      CUSTOMER: ${{ inputs.customer }}
      STATE_BUCKET: ${{ inputs.state_bucket }}
      EXPIRY_ID: ${{ inputs.expiry_id }}
      EXPIRES_AT: ${{ inputs.expires_at }}
      COST_EVIDENCE_JSON: ${{ secrets.DEMO_COST_EVIDENCE_JSON }}
    steps:
      - name: Check out selected main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate immutable inputs and paid gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$CUSTOMER" =~ ^[a-z][a-z0-9-]{1,38}[a-z0-9]$ ]]
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ ]]
          [[ "$EXPIRY_ID" =~ ^[a-z0-9][a-z0-9-]{5,48}[a-z0-9]$ ]]
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          value = datetime.fromisoformat(os.environ["EXPIRES_AT"].replace("Z", "+00:00"))
          delta = value - datetime.now(timezone.utc)
          assert value.utcoffset().total_seconds() == 0
          assert value.second == 0 and value.microsecond == 0
          assert 0 < delta.total_seconds() <= 13200
          PY
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.18"
      - name: Install deployment CLI
        run: uv sync --frozen --project tooling/fde
      - name: Require root-authorized current private cost evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COST_EVIDENCE_JSON"
          printf '%s' "$COST_EVIDENCE_JSON" > "$RUNNER_TEMP/fde-paid-cost-evidence.yaml"
          uv run --project tooling/fde python -c \
            "from fde_cli.cost import load_cost_gate; from fde_cli.operations import validate_paid_cost_gate; validate_paid_cost_gate(load_cost_gate('$RUNNER_TEMP/fde-paid-cost-evidence.yaml'))"
      - name: Authenticate infrastructure identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Reconcile pre-seeded bootstrap state and protected identities
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://$STATE_BUCKET" --format=json >/dev/null || {
            echo "Run the one-time owner-authenticated 'fde bootstrap' seed before this keyless workflow." >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/fde-private"
          python - <<'PY'
          import os, yaml
          data = {
              "customer": os.environ["CUSTOMER"], "environment": "staging",
              "project": os.environ["PROJECT_ID"], "region": os.environ["REGION"],
              "zone": os.environ["ZONE"], "profile": "demo", "namespace": "staging",
              "image_repository": f"{os.environ['REGION']}-docker.pkg.dev/{os.environ['PROJECT_ID']}/placeholder/backend",
              "image_digest": "sha256:" + "a" * 64,
              "frontend_image_repository": f"{os.environ['REGION']}-docker.pkg.dev/{os.environ['PROJECT_ID']}/placeholder/frontend",
              "frontend_image_digest": "sha256:" + "b" * 64,
              "app_version": os.environ["GITHUB_SHA"], "branding": {"name": "FDE Demo"},
              "sizing": {"api_replicas": 2, "worker_replicas": 1, "api_cpu": "250m", "api_memory": "384Mi", "worker_cpu": "250m", "worker_memory": "384Mi"},
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "fde-private", "bootstrap-config.yaml"), "w", encoding="utf-8") as stream:
              yaml.safe_dump(data, stream, sort_keys=False)
          PY
          uv run --project tooling/fde fde bootstrap \
            --config "$RUNNER_TEMP/fde-private/bootstrap-config.yaml" \
            --customer "$CUSTOMER" --environment staging --project "$PROJECT_ID" \
            --terraform-dir infra/terraform/bootstrap \
            --state-bucket "$STATE_BUCKET" \
            --github-repository "$GITHUB_REPOSITORY" \
            --confirm-project "$PROJECT_ID"
      - name: Apply expiry guard and execute control-flow probes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/fde-private"
          project_number=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          jq -n \
            --arg project_id "$PROJECT_ID" --arg project_number "$project_number" \
            --arg region "$REGION" --arg zone "$ZONE" --arg expiry_id "$EXPIRY_ID" \
            --arg expires_at "$EXPIRES_AT" --arg cluster_name "fde-${CUSTOMER}-demo" \
            --arg repository "fde-${CUSTOMER}-images" \
            --arg staging_bucket "${PROJECT_ID}-fde-${CUSTOMER}-staging" \
            --arg production_bucket "${PROJECT_ID}-fde-${CUSTOMER}-production-demo" \
            --arg prefix "fde-${CUSTOMER}" \
            '{project_id:$project_id,project_number:$project_number,region:$region,zone:$zone,expiry_id:$expiry_id,expires_at:$expires_at,cluster_name:$cluster_name,artifact_repository:$repository,bucket_names:[$staging_bucket,$production_bucket],disk_names:[($prefix+"-observability-loki"),($prefix+"-observability-prometheus"),($prefix+"-observability-tempo"),($prefix+"-production-demo-postgres"),($prefix+"-production-demo-redis"),($prefix+"-staging-postgres"),($prefix+"-staging-redis")],address_resources:[]}' \
            > "$private_dir/expiry.auto.tfvars.json"
          terraform -chdir=infra/terraform/environments/expiry init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=expiry/$EXPIRY_ID"
          terraform -chdir=infra/terraform/environments/expiry apply -input=false -lock-timeout=60s \
            -auto-approve -var-file="$private_dir/expiry.auto.tfvars.json"
          manifest_sha=$(terraform -chdir=infra/terraform/environments/expiry output -raw manifest_sha)
          workflow_name=$(terraform -chdir=infra/terraform/environments/expiry output -raw workflow_name)
          schedules=$(terraform -chdir=infra/terraform/environments/expiry output -json scheduler_jobs)
          test "$(jq 'length' <<<"$schedules")" -eq 3

          run_execution() {
            local mode=$1
            local supplied_sha=$2
            local output=$3
            local argument
            argument=$(jq -nc --arg mode "$mode" --arg manifest_sha "$supplied_sha" '{mode:$mode,manifest_sha:$manifest_sha}')
            local token
            token=$(gcloud auth print-access-token)
            local created
            created=$(curl --fail --silent --request POST \
              --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg argument "$argument" '{argument:$argument}')" \
              "https://workflowexecutions.googleapis.com/v1/projects/${PROJECT_ID}/locations/${REGION}/workflows/${workflow_name}/executions")
            local execution_id
            execution_id=$(jq -r '.name | split("/")[-1]' <<<"$created")
            test -n "$execution_id"
            for _ in {1..60}; do
              gcloud workflows executions describe "$execution_id" --workflow="$workflow_name" \
                --project="$PROJECT_ID" --location="$REGION" --format=json > "$output"
              state=$(jq -r '.state' "$output")
              [[ "$state" =~ ^(SUCCEEDED|FAILED|CANCELLED)$ ]] && return 0
              sleep 2
            done
            return 1
          }

          run_execution sentinel "$manifest_sha" "$private_dir/sentinel.json"
          sentinel=$(cat "$private_dir/sentinel.json")
          sentinel_state=$(jq -r '.state' <<<"$sentinel")
          sentinel_result=$(jq -r '.result' <<<"$sentinel")
          test "$sentinel_state" = SUCCEEDED
          test "$(jq -r '.status' <<<"$sentinel_result")" = sentinel-ok
          test "$(jq -r '.manifest_sha' <<<"$sentinel_result")" = "$manifest_sha"
          test "$(jq -r '.expiry_id' <<<"$sentinel_result")" = "$EXPIRY_ID"

          run_execution sentinel "$(printf '0%.0s' {1..64})" "$private_dir/wrong-sha.json"
          test "$(jq -r '.state' "$private_dir/wrong-sha.json")" = FAILED

          run_execution recovery "$manifest_sha" "$private_dir/recovery.json"
          recovery=$(cat "$private_dir/recovery.json")
          test "$(jq -r '.state' <<<"$recovery")" = SUCCEEDED
          recovery_result=$(jq -r '.result' <<<"$recovery")
          test "$(jq -r '.status' <<<"$recovery_result")" = not-due

          execution_id=$(jq -r '.name | split("/")[-1]' <<<"$sentinel")
          jq -n --arg manifest_sha "$manifest_sha" --arg workflow "$workflow_name" \
            --arg execution_id "$execution_id" --arg expiry_id "$EXPIRY_ID" \
            --arg expires_at "$EXPIRES_AT" \
            '{manifest_sha:$manifest_sha,workflow:$workflow,execution_id:$execution_id,expiry_id:$expiry_id,expires_at:$expires_at,sentinel_status:"sentinel-ok",wrong_sha_rejected:true,early_recovery_status:"not-due"}' \
            > expiry-evidence.json
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "workflow_name=$workflow_name" >> "$GITHUB_OUTPUT"
      - name: Upload sanitized expiry evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expiry-evidence-${{ github.run_id }}
          path: expiry-evidence.json
          if-no-files-found: error
          retention-days: 30
