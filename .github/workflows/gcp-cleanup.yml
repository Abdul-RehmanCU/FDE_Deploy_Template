name: Exact demo cleanup

on:
  workflow_call:
    inputs:
      project_id: { required: true, type: string }
      customer: { required: true, type: string }
      state_bucket: { required: true, type: string }
      expiry_id: { required: true, type: string }
      expires_at: { required: true, type: string }
      confirm_cleanup: { required: true, type: string }
  workflow_dispatch:
    inputs:
      project_id: { description: Dedicated GCP project ID, required: true, type: string }
      customer: { description: Exact demo customer slug, required: true, type: string }
      state_bucket: { description: Exact Terraform state bucket, required: true, type: string }
      expiry_id: { description: Exact cleanup ownership ID, required: true, type: string }
      expires_at: { description: Exact expiry UTC minute used by the guard state, required: true, type: string }
      confirm_cleanup:
        description: Type DESTROY-DEMO to authorize exact owned-resource cleanup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gcp-cleanup-${{ inputs.project_id }}-${{ inputs.customer }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Destroy exact demo and expiry guard
    if: inputs.confirm_cleanup == 'DESTROY-DEMO'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: demo-cleanup
    permissions:
      contents: read # required to check out the selected revision
      id-token: write # required for keyless GCP Workload Identity Federation
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      CUSTOMER: ${{ inputs.customer }}
      STATE_BUCKET: ${{ inputs.state_bucket }}
      EXPIRY_ID: ${{ inputs.expiry_id }}
      EXPIRES_AT: ${{ inputs.expires_at }}
      REGION: northamerica-northeast1
      ZONE: northamerica-northeast1-a
    steps:
      - name: Check out selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.18"
      - name: Install deployment CLI
        run: uv sync --frozen --project tooling/fde
      - name: Authenticate cleanup identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLEANUP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with: { install_components: gke-gcloud-auth-plugin }
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize exact remote states and configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$CUSTOMER" =~ ^[a-z][a-z0-9-]{1,38}[a-z0-9]$ ]]
          [[ "$EXPIRY_ID" =~ ^[a-z0-9][a-z0-9-]{5,48}[a-z0-9]$ ]]
          mkdir -p "$RUNNER_TEMP/fde-cleanup" cleanup-evidence
          gcloud storage buckets list --project="$PROJECT_ID" --filter="name=$STATE_BUCKET" \
            --format='json(name)' > "$RUNNER_TEMP/fde-cleanup/owned-state-buckets.json"
          test "$(jq --arg name "$STATE_BUCKET" '[.[] | select(.name == $name)] | length' "$RUNNER_TEMP/fde-cleanup/owned-state-buckets.json")" -eq 1
          gcloud storage buckets describe "gs://$STATE_BUCKET" --format=json > "$RUNNER_TEMP/fde-cleanup/state-bucket.json"
          project_number=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          jq -e --arg region "$REGION" \
            '(.location | ascii_downcase) == ($region | ascii_downcase) and .labels.application == "fde-template" and .labels.purpose == "terraform-state"' \
            "$RUNNER_TEMP/fde-cleanup/state-bucket.json" >/dev/null
          terraform -chdir=infra/terraform/environments/demo init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=demo/$EXPIRY_ID"
          terraform -chdir=infra/terraform/environments/expiry init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=expiry/$EXPIRY_ID"
          jq -n --arg project_id "$PROJECT_ID" --arg project_number "$project_number" \
            --arg region "$REGION" --arg zone "$ZONE" --arg expiry_id "$EXPIRY_ID" \
            --arg expires_at "$EXPIRES_AT" --arg cluster_name "fde-${CUSTOMER}-demo" \
            --arg repository "fde-${CUSTOMER}-images" \
            --arg staging_bucket "${PROJECT_ID}-fde-${CUSTOMER}-staging" \
            --arg production_bucket "${PROJECT_ID}-fde-${CUSTOMER}-production-demo" \
            --arg prefix "fde-${CUSTOMER}" \
            '{project_id:$project_id,project_number:$project_number,region:$region,zone:$zone,expiry_id:$expiry_id,expires_at:$expires_at,cluster_name:$cluster_name,artifact_repository:$repository,bucket_names:[$staging_bucket,$production_bucket],disk_resources:[{name:($prefix+"-observability-loki")},{name:($prefix+"-observability-prometheus")},{name:($prefix+"-observability-tempo")},{name:($prefix+"-production-demo-postgres")},{name:($prefix+"-production-demo-redis")},{name:($prefix+"-staging-postgres")},{name:($prefix+"-staging-redis")}],address_resources:[]}' \
            > "$RUNNER_TEMP/fde-cleanup/fallback-manifest.json"
          if ! terraform -chdir=infra/terraform/environments/expiry output -json compiled_manifest \
            > "$RUNNER_TEMP/fde-cleanup/manifest.json" 2>/dev/null; then
            cp "$RUNNER_TEMP/fde-cleanup/fallback-manifest.json" "$RUNNER_TEMP/fde-cleanup/manifest.json"
          fi
          jq '{project_id,project_number,region,zone,expiry_id,expires_at,cluster_name,artifact_repository,bucket_names,disk_names:[.disk_resources[].name],address_resources}' \
            "$RUNNER_TEMP/fde-cleanup/manifest.json" > "$RUNNER_TEMP/fde-cleanup/expiry.auto.tfvars.json"
          uv run --project tooling/fde python - <<'PY'
          import os, yaml
          data = {
              "customer": os.environ["CUSTOMER"], "environment": "staging",
              "project": os.environ["PROJECT_ID"], "region": os.environ["REGION"], "zone": os.environ["ZONE"],
              "profile": "demo", "namespace": "staging",
              "image_repository": f"{os.environ['REGION']}-docker.pkg.dev/{os.environ['PROJECT_ID']}/placeholder/backend",
              "image_digest": "sha256:" + "a" * 64,
              "frontend_image_repository": f"{os.environ['REGION']}-docker.pkg.dev/{os.environ['PROJECT_ID']}/placeholder/frontend",
              "frontend_image_digest": "sha256:" + "b" * 64,
              "app_version": os.environ["GITHUB_SHA"], "branding": {"name": "FDE Demo"},
              "sizing": {"api_replicas": 2, "worker_replicas": 1, "api_cpu": "250m", "api_memory": "384Mi", "worker_cpu": "250m", "worker_memory": "384Mi"},
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "fde-cleanup", "config.yaml"), "w", encoding="utf-8") as stream:
              yaml.safe_dump(data, stream, sort_keys=False)
          PY
      - name: Capture pre-destroy evidence
        shell: bash
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "fde-${CUSTOMER}-demo" --zone="$ZONE" --project="$PROJECT_ID" >/dev/null 2>&1 || true
          uv run --project tooling/fde fde evidence \
            --config "$RUNNER_TEMP/fde-cleanup/config.yaml" \
            --customer "$CUSTOMER" --environment staging --project "$PROJECT_ID" \
            --output-dir cleanup-evidence/pre || true
      - name: Destroy runtime and require zero owned residue
        shell: bash
        run: |
          set -euo pipefail
          uv run --project tooling/fde fde destroy \
            --config "$RUNNER_TEMP/fde-cleanup/config.yaml" \
            --customer "$CUSTOMER" --environment staging --project "$PROJECT_ID" \
            --terraform-dir infra/terraform/environments/demo \
            --confirm-customer "$CUSTOMER" --expiry-id "$EXPIRY_ID" \
            --expiry-terraform-dir infra/terraform/environments/expiry \
            --manifest-file "$RUNNER_TEMP/fde-cleanup/fallback-manifest.json" \
            > cleanup-evidence/runtime-destroy.json
      - name: Destroy expiry guard after runtime reconciliation
        shell: bash
        run: |
          set -euo pipefail
          workflow_name="fde-expiry-${EXPIRY_ID}"
          scheduler_jobs=("fde-expiry-${EXPIRY_ID}-primary" "fde-expiry-${EXPIRY_ID}-recovery_1" "fde-expiry-${EXPIRY_ID}-recovery_2")
          terraform -chdir=infra/terraform/environments/expiry destroy -input=false -auto-approve -lock-timeout=60s \
            -var-file="$RUNNER_TEMP/fde-cleanup/expiry.auto.tfvars.json"
          if gcloud workflows describe "$workflow_name" --project="$PROJECT_ID" --location="$REGION" >/dev/null 2>&1; then
            echo "expiry workflow remains: $workflow_name" >&2
            exit 1
          fi
          for job in "${scheduler_jobs[@]}"; do
            if gcloud scheduler jobs describe "$job" --project="$PROJECT_ID" --location="$REGION" >/dev/null 2>&1; then
              echo "expiry scheduler remains: $job" >&2
              exit 1
            fi
          done
          gcloud asset search-all-resources --scope="projects/$PROJECT_ID" \
            --query="labels.expiry-id=$EXPIRY_ID" --format=json > cleanup-evidence/final-owned-assets.json
          test "$(jq 'length' cleanup-evidence/final-owned-assets.json)" -eq 0
          jq -n --arg project "$PROJECT_ID" --arg customer "$CUSTOMER" --arg expiry_id "$EXPIRY_ID" \
            '{project:$project,customer:$customer,expiry_id:$expiry_id,runtime_residue:0,expiry_guard_removed:true,owner_bootstrap_teardown_required:true}' \
            > cleanup-evidence/cleanup-summary.json
      - name: Upload sanitized cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cleanup-evidence-${{ github.run_id }}
          path: cleanup-evidence
          if-no-files-found: warn
          retention-days: 30
