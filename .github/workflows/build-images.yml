name: Build immutable cloud images

on:
  workflow_call:
    inputs:
      project_id:
        description: Dedicated GCP project ID
        required: true
        type: string
      artifact_repository:
        description: Montréal Artifact Registry repository ID
        required: true
        type: string
    outputs:
      backend_digest:
        description: Immutable backend image digest
        value: ${{ jobs.build.outputs.backend_digest }}
      frontend_digest:
        description: Immutable frontend image digest
        value: ${{ jobs.build.outputs.frontend_digest }}
      manifest_sha256:
        description: SHA-256 of the signed digest manifest
        value: ${{ jobs.build.outputs.manifest_sha256 }}
  workflow_dispatch:
    inputs:
      project_id:
        description: Dedicated GCP project ID
        required: true
        type: string
      artifact_repository:
        description: Montréal Artifact Registry repository ID
        required: true
        default: fde
        type: string

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish by digest
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    permissions:
      contents: read # required to check out the selected revision
      id-token: write # required for keyless GCP Workload Identity Federation
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo-build
    env:
      REGION: northamerica-northeast1
      REGISTRY: northamerica-northeast1-docker.pkg.dev
    steps:
      - name: Check out selected main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/backend:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/frontend:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan published backend digest
        id: scan-backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/backend@${{ steps.backend.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Scan published frontend digest
        id: scan-frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/frontend@${{ steps.frontend.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Require both published digests to pass policy
        if: always()
        env:
          BACKEND_SCAN: ${{ steps.scan-backend.outcome }}
          FRONTEND_SCAN: ${{ steps.scan-frontend.outcome }}
        run: |
          test "$BACKEND_SCAN" = success
          test "$FRONTEND_SCAN" = success
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create signed digest manifest
        id: manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ inputs.project_id }}/${{ inputs.artifact_repository }}
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg region "$REGION" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg backend_digest "$BACKEND_DIGEST" \
            --arg frontend_digest "$FRONTEND_DIGEST" \
            '{schema_version:1, commit:$commit, region:$region, repository:$repository, images:{backend:{name:"backend",digest:$backend_digest},frontend:{name:"frontend",digest:$frontend_digest}}}' \
            > image-digests.json
          sha256=$(sha256sum image-digests.json | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          cosign sign-blob --yes --bundle image-digests.sigstore.json image-digests.json
          {
            echo "### Immutable image outputs"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Backend: \`$BACKEND_DIGEST\`"
            echo "- Frontend: \`$FRONTEND_DIGEST\`"
            echo "- Manifest SHA-256: \`$sha256\`"
            echo "- Region: \`${REGION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed digest manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digests-${{ github.sha }}
          path: |
            image-digests.json
            image-digests.sigstore.json
          if-no-files-found: error
          retention-days: 30
