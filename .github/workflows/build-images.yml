name: Build immutable cloud images

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Dedicated GCP project ID
        required: true
        type: string
      artifact_repository:
        description: Montréal Artifact Registry repository ID
        required: true
        default: fde
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-images-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish by digest
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo-build
    env:
      REGION: northamerica-northeast1
      REGISTRY: northamerica-northeast1-docker.pkg.dev
    steps:
      - name: Check out selected main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/backend:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/frontend:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable outputs
        run: |
          {
            echo "### Immutable image outputs"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Backend: \`${{ steps.backend.outputs.digest }}\`"
            echo "- Frontend: \`${{ steps.frontend.outputs.digest }}\`"
            echo "- Region: \`${REGION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
