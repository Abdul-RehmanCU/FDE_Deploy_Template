name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Verify repository invariants
        run: python scripts/ci/verify_repository.py

  backend:
    name: Backend lint, types, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FASTAPI_ENV: test
      PROJECT_NAME: FDE Deployment Template CI
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_HOST: http://localhost:5173
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: ${{ runner.temp }}/fde-storage
      RUN_POSTGRES_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint backend
        run: uv run --package app ruff check backend/app backend/tests
      - name: Type-check backend
        run: uv run --package app mypy backend/app
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Test backend
        run: uv run --package app pytest -q backend/tests

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint frontend
        working-directory: frontend
        run: bunx biome ci --no-errors-on-unmatched --files-ignore-unknown=true ./
      - name: Build frontend
        run: bun run --filter frontend build

  deployment-cli:
    name: Deployment CLI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Test deployment CLI
        run: uv run --project tooling/fde --with pytest pytest -q tooling/fde/tests
