name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.18"
      - name: Audit workflow security
        run: uv run --frozen --only-group dev zizmor --pedantic .github/workflows
      - name: Verify repository invariants
        run: python scripts/ci/verify_repository.py

  backend:
    name: Backend lint, types, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FASTAPI_ENV: test
      PROJECT_NAME: FDE Deployment Template CI
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_HOST: http://localhost:5173
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /tmp/fde-storage
      RUN_POSTGRES_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint backend
        run: uv run --package app ruff check backend/app backend/tests
      - name: Type-check backend
        run: uv run --package app mypy backend/app
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Test backend
        run: uv run --package app pytest -q backend/tests
      - name: Exercise backup and restore into disposable database
        run: bash backend/scripts/test-backup-restore.sh

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --locked --all-groups
      - name: Lint frontend
        working-directory: frontend
        run: bunx biome ci --no-errors-on-unmatched --files-ignore-unknown=true ./
      - name: Build frontend
        run: bun run --filter frontend build
      - name: Verify generated client matches OpenAPI
        shell: bash
        env:
          FASTAPI_ENV: test
          SECRET_KEY: client-generation-only-secret-with-32-characters
          DATABASE_URL: postgresql://postgres:unused@localhost:5432/app
          REDIS_URL: redis://localhost:6379/0
          STORAGE_BACKEND: local
        run: |
          uv run --package app python -c "import json; from pathlib import Path; from app.main import app; Path('frontend/openapi.json').write_text(json.dumps(app.openapi(), indent=2), encoding='utf-8')"
          bun run --filter frontend generate-client
          git diff --exit-code -- frontend/src/client

  browser-journey:
    name: Real-stack browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FASTAPI_ENV: test
      PROJECT_NAME: FDE Deployment Template E2E
      SECRET_KEY: e2e-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql://postgres:e2e-postgres-password@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      BACKEND_CORS_ORIGINS: http://127.0.0.1:5173
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /tmp/fde-e2e-storage
      VITE_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      E2E_ADMIN_PASSWORD: E2E-Admin-Password-2026!
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Migrate and bootstrap administrator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STORAGE_LOCAL_ROOT"
          (cd backend && uv run alembic upgrade head)
          bootstrap_output=$(cd backend && uv run python -m app.bootstrap_admin e2e-admin@example.com --full-name "E2E Administrator")
          temporary_password=$(printf '%s\n' "$bootstrap_output" | sed -n 's/^One-time temporary password: //p')
          test -n "$temporary_password"
          echo "::add-mask::$temporary_password"
          echo "E2E_ADMIN_TEMP_PASSWORD=$temporary_password" >> "$GITHUB_ENV"
      - name: Start real application stack
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && nohup uv run fastapi run app/main.py --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd backend && nohup uv run celery -A app.worker.celery_app worker --loglevel=warning --concurrency=1 > "$RUNNER_TEMP/worker.log" 2>&1 &)
          (cd backend && nohup uv run python -m app.outbox_publisher > "$RUNNER_TEMP/publisher.log" 2>&1 &)
          (cd frontend && nohup bunx vite --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1 &)
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/frontend.log"
          exit 1
      - name: Run role and import journeys
        working-directory: frontend
        run: bunx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results/evidence/*.png
            frontend/test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 14

  kind-rehearsal:
    name: kind deployment rehearsal
    needs: infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: fde-ci
          version: v0.30.0
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1
      - name: Build application images
        run: |
          docker build --tag localhost/fde-backend:ci --file backend/Dockerfile .
          docker build --tag localhost/fde-frontend:ci --file frontend/Dockerfile .
      - name: Load images into kind
        run: |
          kind load docker-image --name fde-ci localhost/fde-backend:ci
          kind load docker-image --name fde-ci localhost/fde-frontend:ci
      - name: Install chart with isolated test secrets
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace fde-staging
          kubectl -n fde-staging create secret generic fde-runtime-secrets \
            --from-literal=secret-key=kind-only-secret-key-with-at-least-32-characters \
            --from-literal=postgres-password=kind-postgres-password \
            --from-literal=redis-password=kind-redis-password \
            --from-literal=database-url=postgresql://app:kind-postgres-password@fde-ci-demo-staging-postgres:5432/app \
            --from-literal=redis-url=redis://:kind-redis-password@fde-ci-demo-staging-redis:6379/0
          helm upgrade --install fde infra/helm/fde \
            --namespace fde-staging \
            --values infra/helm/fde/values-kind.yaml \
            --set-string branding.name='CI Customer Directory' \
            --wait \
            --wait-for-jobs \
            --timeout 12m
      - name: Verify probes, migration, and frontend proxy
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n fde-staging wait --for=condition=complete job/fde-ci-demo-staging-migrate-1 --timeout=120s
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-api --timeout=120s
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-worker --timeout=120s
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-publisher --timeout=120s
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-frontend --timeout=120s
          kubectl -n fde-staging port-forward service/fde-ci-demo-staging-frontend 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null && \
               curl --fail --silent http://127.0.0.1:18080/api/v1/health/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:18080/runtime-config.js | grep --fixed-strings 'brandName: "CI Customer Directory"' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/port-forward.log"
          exit 1
      - name: Run containerized import and directory journey
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n fde-staging port-forward service/fde-ci-demo-staging-frontend 18081:8080 > "$RUNNER_TEMP/journey-port-forward.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18081/ >/dev/null && break
            sleep 1
          done

          bootstrap_output=$(kubectl -n fde-staging exec deployment/fde-ci-demo-staging-api -- python -m app.bootstrap_admin kind-admin@example.com --full-name "Kind Administrator")
          temporary_password=$(printf '%s\n' "$bootstrap_output" | sed -n 's/^One-time temporary password: //p')
          test -n "$temporary_password"
          echo "::add-mask::$temporary_password"

          token=$(curl --fail --silent --request POST \
            --data-urlencode username=kind-admin@example.com \
            --data-urlencode password="$temporary_password" \
            http://127.0.0.1:18081/api/v1/login/access-token | jq --raw-output .access_token)
          new_password=Kind-Admin-Password-2026!
          curl --fail --silent --request POST \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --data "{\"current_password\":\"$temporary_password\",\"new_password\":\"$new_password\"}" \
            http://127.0.0.1:18081/api/v1/users/me/password >/dev/null
          token=$(curl --fail --silent --request POST \
            --data-urlencode username=kind-admin@example.com \
            --data-urlencode password="$new_password" \
            http://127.0.0.1:18081/api/v1/login/access-token | jq --raw-output .access_token)

          import_id=$(curl --fail --silent \
            --header "Authorization: Bearer $token" \
            --form file=@fixtures/customer-data/valid-contacts.csv \
            http://127.0.0.1:18081/api/v1/imports | jq --raw-output .id)
          curl --fail --silent --request PUT \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --data '{"mapping":{"email":"Email","first_name":"First Name","last_name":"Last Name","company":"Company","country_code":"Country","external_id":"External ID"}}' \
            "http://127.0.0.1:18081/api/v1/imports/$import_id/mapping" >/dev/null
          curl --fail --silent --request POST \
            --header "Authorization: Bearer $token" \
            "http://127.0.0.1:18081/api/v1/imports/$import_id/validate" >/dev/null

          for attempt in {1..60}; do
            status=$(curl --fail --silent --header "Authorization: Bearer $token" \
              "http://127.0.0.1:18081/api/v1/imports/$import_id" | jq --raw-output .status)
            test "$status" = validated && break
            test "$status" != failed
            sleep 2
          done
          test "$status" = validated
          curl --fail --silent --request POST \
            --header "Authorization: Bearer $token" \
            --header "Idempotency-Key: kind-confirm-001" \
            "http://127.0.0.1:18081/api/v1/imports/$import_id/confirm" >/dev/null
          for attempt in {1..60}; do
            status=$(curl --fail --silent --header "Authorization: Bearer $token" \
              "http://127.0.0.1:18081/api/v1/imports/$import_id" | jq --raw-output .status)
            test "$status" = completed && break
            test "$status" != failed
            sleep 2
          done
          test "$status" = completed
          contact_count=$(curl --fail --silent --get \
            --header "Authorization: Bearer $token" \
            --data-urlencode q=amelie.tremblay@example.com \
            http://127.0.0.1:18081/api/v1/contacts | jq '.data | length')
          test "$contact_count" -eq 1
      - name: Measure rolling update and recover unhealthy release
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n fde-staging run fde-rolling-probe \
            --image=curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 \
            --labels=fde.dev/probe=true \
            --restart=Never \
            --command -- sh -ec '
              while test ! -f /tmp/stop; do
                phase=warmup; test -f /tmp/rollout && phase=rollout
                code=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 2 http://fde-ci-demo-staging-api:8000/api/v1/health/live || true)
                status=error; test "$code" = 200 && status=success
                echo "$(date -u +%s) $phase $status ${code:-000}"
                sleep 0.2
              done'
          kubectl -n fde-staging wait --for=condition=Ready pod/fde-rolling-probe --timeout=120s
          sleep 3
          kubectl -n fde-staging exec fde-rolling-probe -- touch /tmp/rollout
          rollout_started=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          kubectl -n fde-staging patch deployment/fde-ci-demo-staging-api \
            --type merge \
            --patch "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"fde.dev/rollout-probe\":\"$(date +%s)\"}}}}}"
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-api --timeout=180s
          rollout_finished=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          kubectl -n fde-staging exec fde-rolling-probe -- touch /tmp/stop
          kubectl -n fde-staging wait --for=jsonpath='{.status.phase}'=Succeeded pod/fde-rolling-probe --timeout=30s
          kubectl -n fde-staging logs fde-rolling-probe > "$RUNNER_TEMP/rolling-probe.txt"
          warmup_successes=$(awk '$2=="warmup" && $3=="success" {count++} END {print count+0}' "$RUNNER_TEMP/rolling-probe.txt")
          warmup_errors=$(awk '$2=="warmup" && $3=="error" {count++} END {print count+0}' "$RUNNER_TEMP/rolling-probe.txt")
          rollout_successes=$(awk '$2=="rollout" && $3=="success" {count++} END {print count+0}' "$RUNNER_TEMP/rolling-probe.txt")
          rollout_errors=$(awk '$2=="rollout" && $3=="error" {count++} END {print count+0}' "$RUNNER_TEMP/rolling-probe.txt")
          error_codes=$(awk '$3=="error" {count[$4]++} END {for (code in count) printf "%s=%s ", code, count[code]}' "$RUNNER_TEMP/rolling-probe.txt")
          test "$rollout_successes" -gt 0
          echo "Rolling probe warmup=$warmup_successes/$warmup_errors rollout=$rollout_successes/$rollout_errors"
          {
            echo "### kind rolling update measurement"
            echo "- Warmup successful/failed: $warmup_successes / $warmup_errors"
            echo "- Rollout successful/failed: $rollout_successes / $rollout_errors"
            echo "- Error status categories: ${error_codes:-none}"
            echo "- Rollout window: $rollout_started to $rollout_finished"
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          helm upgrade fde infra/helm/fde \
            --namespace fde-staging \
            --values infra/helm/fde/values-kind.yaml \
            --set-string branding.name='CI Customer Directory' \
            --set appVersion=ci-unhealthy \
            --set images.backend.tag=missing-ci \
            --no-hooks \
            --wait \
            --timeout 90s
          failed_release_status=$?
          set -e
          test "$failed_release_status" -ne 0
          helm rollback fde 1 \
            --namespace fde-staging \
            --wait \
            --timeout 3m
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-api --timeout=180s
          restored_image=$(kubectl -n fde-staging get deployment/fde-ci-demo-staging-api -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "$restored_image" = localhost/fde-backend:ci
          kubectl -n fde-staging port-forward service/fde-ci-demo-staging-frontend 18084:8080 > "$RUNNER_TEMP/recovery-port-forward.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18084/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/recovery-port-forward.log"
          exit 1
      - name: Upload timestamped rolling probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-rolling-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/rolling-probe.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Restart worker without losing readiness
        run: |
          kubectl -n fde-staging delete pod --selector=app.kubernetes.io/component=worker
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-worker --timeout=120s
      - name: Collect failure diagnostics
        if: failure()
        run: |
          kubectl -n fde-staging get all,pvc
          kubectl -n fde-staging describe pods
          kubectl -n fde-staging logs --all-containers --prefix --tail=200 --selector=app.kubernetes.io/name=fde

  observability-kind:
    name: kind observability rehearsal
    needs: infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Install browser evidence dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: fde-observability-ci
          version: v0.30.0
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1
      - name: Build application images
        run: |
          docker build --tag localhost/fde-backend:ci --file backend/Dockerfile .
          docker build --tag localhost/fde-frontend:ci --file frontend/Dockerfile .
      - name: Load images into kind
        run: |
          kind load docker-image --name fde-observability-ci localhost/fde-backend:ci
          kind load docker-image --name fde-observability-ci localhost/fde-frontend:ci
      - name: Install application and bootstrap test administrator
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace fde-staging
          kubectl -n fde-staging create secret generic fde-runtime-secrets \
            --from-literal=secret-key=kind-only-secret-key-with-at-least-32-characters \
            --from-literal=postgres-password=kind-postgres-password \
            --from-literal=redis-password=kind-redis-password \
            --from-literal=database-url=postgresql://app:kind-postgres-password@fde-ci-demo-staging-postgres:5432/app \
            --from-literal=redis-url=redis://:kind-redis-password@fde-ci-demo-staging-redis:6379/0
          helm upgrade --install fde infra/helm/fde \
            --namespace fde-staging \
            --values infra/helm/fde/values-kind.yaml \
            --set-string branding.name='CI Customer Directory' \
            --wait \
            --wait-for-jobs \
            --timeout 12m
          kubectl -n fde-staging wait --for=condition=complete job/fde-ci-demo-staging-migrate-1 --timeout=180s
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-api --timeout=180s
          kubectl -n fde-staging port-forward service/fde-ci-demo-staging-frontend 18085:8080 > "$RUNNER_TEMP/observability-bootstrap-forward.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18085/api/v1/health/ready >/dev/null && break
            sleep 1
          done
          bootstrap_output=$(kubectl -n fde-staging exec deployment/fde-ci-demo-staging-api -- python -m app.bootstrap_admin kind-admin@example.com --full-name "Kind Administrator")
          temporary_password=$(printf '%s\n' "$bootstrap_output" | sed -n 's/^One-time temporary password: //p')
          test -n "$temporary_password"
          echo "::add-mask::$temporary_password"
          token=$(curl --fail --silent --request POST \
            --data-urlencode username=kind-admin@example.com \
            --data-urlencode password="$temporary_password" \
            http://127.0.0.1:18085/api/v1/login/access-token | jq --raw-output .access_token)
          curl --fail --silent --request POST \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --data "{\"current_password\":\"$temporary_password\",\"new_password\":\"Kind-Admin-Password-2026!\"}" \
            http://127.0.0.1:18085/api/v1/users/me/password >/dev/null
      - name: Install compact observability stack
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace observability
          grafana_password=kind-grafana-password-2026
          echo "::add-mask::$grafana_password"
          kubectl -n observability create secret generic fde-grafana-admin \
            --from-literal=username=admin \
            --from-literal=password="$grafana_password"
          helm upgrade --install fde-observability observability/helm \
            --namespace observability \
            --values observability/helm/values-kind.yaml
          for attempt in {1..90}; do
            alloy_pod=$(kubectl -n observability get pod -l app.kubernetes.io/name=fde-alloy -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if test -n "$alloy_pod"; then
              init_exit=$(kubectl -n observability get pod "$alloy_pod" -o jsonpath='{.status.initContainerStatuses[0].state.terminated.exitCode}' 2>/dev/null || true)
              if test -n "$init_exit" && test "$init_exit" -ne 0; then
                kubectl -n observability logs "$alloy_pod" -c validate-config --tail=200 || true
                exit 1
              fi
              ready=$(kubectl -n observability get pod "$alloy_pod" -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || true)
              restarts=$(kubectl -n observability get pod "$alloy_pod" -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null || true)
              if test "$ready" = true; then break; fi
              if test -n "$restarts" && test "$restarts" -ge 2; then
                kubectl -n observability logs "$alloy_pod" -c alloy --tail=200 || true
                kubectl -n observability logs "$alloy_pod" -c alloy --previous --tail=200 || true
                exit 1
              fi
            fi
            sleep 2
          done
          kubectl -n observability rollout status daemonset/fde-alloy --timeout=30s
          kubectl -n observability rollout status deployment/fde-otel-collector --timeout=180s
          helm upgrade fde infra/helm/fde \
            --namespace fde-staging \
            --values infra/helm/fde/values-kind.yaml \
            --set-string branding.name='CI Customer Directory' \
            --set observability.enabled=true \
            --set observability.otlpEndpoint=http://fde-otel-collector.observability.svc.cluster.local:4317 \
            --wait \
            --timeout 5m
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-api --timeout=180s
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-worker --timeout=180s
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-publisher --timeout=180s
      - name: Verify metrics logs traces dashboard and alert lifecycle
        shell: bash
        run: |
          set -euo pipefail
          verification_failed=0
          evidence_dir="$RUNNER_TEMP/observability-evidence"
          mkdir -p "$evidence_dir"
          kubectl -n observability rollout status statefulset/fde-prometheus --timeout=180s
          kubectl -n observability rollout status statefulset/fde-loki --timeout=180s
          kubectl -n observability rollout status statefulset/fde-tempo --timeout=180s
          kubectl -n observability rollout status deployment/fde-grafana --timeout=180s
          kubectl -n observability rollout status deployment/fde-alertmanager --timeout=180s
          kubectl -n observability rollout status deployment/fde-otel-collector --timeout=180s
          kubectl -n observability rollout status daemonset/fde-alloy --timeout=180s

          kubectl -n observability port-forward service/fde-prometheus 19090:9090 > "$RUNNER_TEMP/prometheus-forward.log" 2>&1 &
          kubectl -n observability port-forward service/fde-loki 13100:3100 > "$RUNNER_TEMP/loki-forward.log" 2>&1 &
          kubectl -n observability port-forward service/fde-tempo 13200:3200 > "$RUNNER_TEMP/tempo-forward.log" 2>&1 &
          kubectl -n observability port-forward service/fde-grafana 13000:3000 > "$RUNNER_TEMP/grafana-forward.log" 2>&1 &
          kubectl -n observability port-forward service/fde-alertmanager 19093:9093 > "$RUNNER_TEMP/alertmanager-forward.log" 2>&1 &
          kubectl -n fde-staging port-forward service/fde-ci-demo-staging-frontend 18083:8080 > "$RUNNER_TEMP/observed-app-forward.log" 2>&1 &

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:19090/-/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:13100/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:13200/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:13000/api/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:18083/api/v1/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            api_targets=$(curl --fail --silent --get --data-urlencode 'query=up{job="fde-api"}' http://127.0.0.1:19090/api/v1/query | jq '.data.result | map(select(.["value"][1] == "1")) | length')
            worker_up=$(curl --fail --silent --get --data-urlencode 'query=fde_worker_up' http://127.0.0.1:19090/api/v1/query | jq '.data.result | map(select(.["value"][1] == "1")) | length')
            if test "$api_targets" -ge 2 && test "$worker_up" -ge 1; then break; fi
            sleep 2
          done
          test "$api_targets" -ge 2
          test "$worker_up" -ge 1

          grafana_password=kind-grafana-password-2026
          curl --fail --silent --user "admin:$grafana_password" \
            'http://127.0.0.1:13000/api/search?query=FDE' > "$evidence_dir/grafana-search.json"
          jq -e 'any(.[]; .uid == "fde-operations-overview")' "$evidence_dir/grafana-search.json" >/dev/null

          token=$(curl --fail --silent --request POST \
            --data-urlencode username=kind-admin@example.com \
            --data-urlencode password=Kind-Admin-Password-2026! \
            http://127.0.0.1:18083/api/v1/login/access-token | jq --raw-output .access_token)
          import_id=$(curl --fail --silent \
            --header "Authorization: Bearer $token" \
            --form file=@fixtures/customer-data/formula-like.csv \
            http://127.0.0.1:18083/api/v1/imports | jq --raw-output .id)
          [[ "$import_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          curl --fail --silent --request PUT \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --data '{"mapping":{"email":"Email","first_name":"First Name","last_name":"Last Name","company":"Company","country_code":"Country","external_id":"External ID"}}' \
            "http://127.0.0.1:18083/api/v1/imports/$import_id/mapping" >/dev/null
          curl --fail --silent --dump-header "$RUNNER_TEMP/validate-response-headers.txt" --request POST \
            --header "Authorization: Bearer $token" \
            "http://127.0.0.1:18083/api/v1/imports/$import_id/validate" >/dev/null
          trace_id=$(awk 'tolower($1) == "x-trace-id:" {gsub("\\r", "", $2); print $2}' "$RUNNER_TEMP/validate-response-headers.txt" | tail -1)
          [[ "$trace_id" =~ ^[0-9a-f]{32}$ ]]
          printf '%s\n' "$trace_id" > "$evidence_dir/trace-id.txt"
          for attempt in {1..60}; do
            status=$(curl --fail --silent --header "Authorization: Bearer $token" "http://127.0.0.1:18083/api/v1/imports/$import_id" | jq --raw-output .status)
            test "$status" = validated && break
            sleep 2
          done
          test "$status" = validated
          stored_traceparent=$(kubectl -n fde-staging exec statefulset/fde-ci-demo-staging-postgres -- sh -c \
            "PGPASSWORD=\"\$(cat /var/run/secrets/fde/postgres-password)\" psql -U app -d app -Atc \"SELECT traceparent FROM job WHERE import_id = '$import_id' ORDER BY created_at DESC LIMIT 1\"")
          if [[ "$stored_traceparent" != "00-$trace_id-"* ]]; then
            echo "Stored job trace carrier does not match the API trace." > "$evidence_dir/trace-carrier-failure.txt"
            verification_failed=1
          fi
          for attempt in {1..60}; do
            http_count=$(curl --fail --silent --get --data-urlencode 'query=sum(http_server_request_duration_seconds_count)' http://127.0.0.1:19090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')
            http_buckets=$(curl --fail --silent --get --data-urlencode 'query=count(http_server_request_duration_seconds_bucket)' http://127.0.0.1:19090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')
            import_rows=$(curl --fail --silent --get --data-urlencode 'query=count(fde_import_rows)' http://127.0.0.1:19090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')
            oldest_job=$(curl --fail --silent --get --data-urlencode 'query=count(fde_oldest_queued_job_seconds)' http://127.0.0.1:19090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')
            database_connections=$(curl --fail --silent --get --data-urlencode 'query=count(fde_database_connections)' http://127.0.0.1:19090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')
            job_attempts=$(curl --fail --silent --get --data-urlencode 'query=count(fde_job_attempts)' http://127.0.0.1:19090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')
            if awk -v a="$http_count" -v b="$http_buckets" -v c="$import_rows" -v d="$oldest_job" -v e="$database_connections" -v f="$job_attempts" 'BEGIN { exit !(a>0 && b>0 && c>0 && d>0 && e>0 && f>0) }'; then break; fi
            sleep 2
          done
          if ! awk -v a="$http_count" -v b="$http_buckets" -v c="$import_rows" -v d="$oldest_job" -v e="$database_connections" -v f="$job_attempts" 'BEGIN { exit !(a>0 && b>0 && c>0 && d>0 && e>0 && f>0) }'; then
            verification_failed=1
          fi
          jq -n --argjson api_targets "$api_targets" --argjson worker_up "$worker_up" \
            --arg http_count "$http_count" --arg http_buckets "$http_buckets" \
            --arg import_rows "$import_rows" --arg oldest_job "$oldest_job" \
            --arg database_connections "$database_connections" --arg job_attempts "$job_attempts" \
            '{api_targets:$api_targets,worker_up:$worker_up,http_request_count:($http_count|tonumber),http_histogram_buckets:($http_buckets|tonumber),worker_series:{import_rows:($import_rows|tonumber),oldest_queued_job:($oldest_job|tonumber),database_connections:($database_connections|tonumber),job_attempts:($job_attempts|tonumber)}}' \
            > "$evidence_dir/metrics-summary.json"
          printf '{"trace":{"resourceSpans":[]}}\n' > "$evidence_dir/tempo-trace-last.json"
          for attempt in {1..60}; do
            tempo_status=$(curl --silent --output "$evidence_dir/tempo-trace-last.json" --write-out '%{http_code}' "http://127.0.0.1:13200/api/v2/traces/$trace_id" || true)
            services=""
            if test "$tempo_status" = 200; then
              services=$(jq -r '.trace.resourceSpans[]?.resource.attributes[]? | select(.key == "service.name") | .value.stringValue' "$evidence_dir/tempo-trace-last.json" | sort -u || true)
            fi
            printf '%s\n' "$services" > "$evidence_dir/trace-services-last.txt"
            if grep -qx fde-api <<<"$services" && grep -qx fde-outbox-publisher <<<"$services" && grep -qx fde-worker <<<"$services"; then break; fi
            sleep 2
          done
          missing_services=""
          for required_service in fde-api fde-outbox-publisher fde-worker; do
            grep -qx "$required_service" <<<"$services" || missing_services="$missing_services $required_service"
          done
          if test -n "$missing_services"; then
            printf 'Tempo status=%s missing services:%s\n' "$tempo_status" "$missing_services" | tee "$evidence_dir/trace-missing-services.txt" >&2
            verification_failed=1
          fi
          printf '%s\n' "$services" > "$evidence_dir/trace-services.txt"
          cp "$evidence_dir/tempo-trace-last.json" "$evidence_dir/tempo-trace.json"

          printf '{"data":{"result":[]}}\n' > "$evidence_dir/loki-trace-last.json"
          for attempt in {1..60}; do
            if ! curl --fail --silent --get \
              --data-urlencode "query={namespace=\"fde-staging\"} | json | trace_id=\"$trace_id\"" \
              --data-urlencode "start=$(date -u -d '15 minutes ago' +%s)000000000" \
              http://127.0.0.1:13100/loki/api/v1/query_range > "$evidence_dir/loki-trace-last.json"; then
              printf '{"data":{"result":[]}}\n' > "$evidence_dir/loki-trace-last.json"
            fi
            log_containers=$(jq -r '.data.result[].stream.container' "$evidence_dir/loki-trace-last.json" | sort -u)
            api_log_count=$(jq '[.data.result[] | select(.stream.container | test("api")) | .values[]] | length' "$evidence_dir/loki-trace-last.json")
            publisher_log_count=$(jq '[.data.result[] | select(.stream.container | test("publisher")) | .values[]] | length' "$evidence_dir/loki-trace-last.json")
            worker_log_count=$(jq '[.data.result[] | select(.stream.container | test("worker")) | .values[]] | length' "$evidence_dir/loki-trace-last.json")
            if test "$api_log_count" -gt 0 && test "$publisher_log_count" -gt 0 && test "$worker_log_count" -gt 0; then break; fi
            sleep 2
          done
          if ! { test "$api_log_count" -gt 0 && test "$publisher_log_count" -gt 0 && test "$worker_log_count" -gt 0; }; then
            verification_failed=1
          fi
          jq -n --arg trace_id "$trace_id" --arg containers "$log_containers" \
            --argjson api "$api_log_count" --argjson publisher "$publisher_log_count" --argjson worker "$worker_log_count" \
            '{trace_id:$trace_id,containers:($containers|split("\n")|map(select(length>0))),log_counts:{api:$api,publisher:$publisher,worker:$worker},pii_included:false}' \
            > "$evidence_dir/loki-trace-summary.json"
          for component in api publisher worker; do
            kubectl -n fde-staging logs --all-containers --prefix --tail=1000 \
              --selector="app.kubernetes.io/component=$component" | grep "$trace_id" \
              > "$evidence_dir/${component}-trace-logs.txt" || true
          done

          kubectl -n fde-staging scale deployment/fde-ci-demo-staging-api --replicas=0
          for attempt in {1..120}; do
            curl --fail --silent http://127.0.0.1:19093/api/v2/alerts > "$evidence_dir/alert-firing.json"
            if jq -e 'any(.[]; .labels.alertname == "FDEApiUnavailable" and .labels.namespace == "fde-staging")' "$evidence_dir/alert-firing.json" >/dev/null; then break; fi
            sleep 3
          done
          if ! jq -e 'any(.[]; .labels.alertname == "FDEApiUnavailable" and .labels.namespace == "fde-staging")' "$evidence_dir/alert-firing.json" >/dev/null; then verification_failed=1; fi
          if ! GRAFANA_URL=http://127.0.0.1:13000 \
            ALERTMANAGER_URL=http://127.0.0.1:19093 \
            GRAFANA_USER=admin GRAFANA_PASSWORD="$grafana_password" \
            TRACE_ID="$trace_id" LOKI_NAMESPACE=fde-staging OUTPUT_DIR="$evidence_dir" ALERT_PHASE=firing \
            bun scripts/ci/capture_observability_evidence.ts; then verification_failed=1; fi
          kubectl -n fde-staging scale deployment/fde-ci-demo-staging-api --replicas=2
          kubectl -n fde-staging rollout status deployment/fde-ci-demo-staging-api --timeout=180s
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:19093/api/v2/alerts > "$evidence_dir/alert-resolved.json"
            if ! jq -e 'any(.[]; .labels.alertname == "FDEApiUnavailable" and .labels.namespace == "fde-staging")' "$evidence_dir/alert-resolved.json" >/dev/null; then break; fi
            sleep 3
          done
          if jq -e 'any(.[]; .labels.alertname == "FDEApiUnavailable" and .labels.namespace == "fde-staging")' "$evidence_dir/alert-resolved.json" >/dev/null; then verification_failed=1; fi
          if ! GRAFANA_URL=http://127.0.0.1:13000 \
            ALERTMANAGER_URL=http://127.0.0.1:19093 \
            GRAFANA_USER=admin GRAFANA_PASSWORD="$grafana_password" \
            TRACE_ID="$trace_id" LOKI_NAMESPACE=fde-staging OUTPUT_DIR="$evidence_dir" ALERT_PHASE=resolved \
            bun scripts/ci/capture_observability_evidence.ts; then verification_failed=1; fi
          kubectl -n observability logs deployment/fde-otel-collector --tail=200 > "$evidence_dir/otel-collector-tail.txt" || true
          kubectl -n observability logs statefulset/fde-tempo --tail=200 > "$evidence_dir/tempo-tail.txt" || true
          kubectl get all -A -o wide > "$evidence_dir/kubernetes-inventory.txt"
          test "$verification_failed" -eq 0
      - name: Upload sanitized kind observability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-observability-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/observability-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Collect observability failure diagnostics
        if: failure()
        run: |
          kubectl -n fde-staging get all,pvc
          kubectl -n observability get all,pvc || true
          kubectl -n observability describe pods || true
          kubectl -n observability logs daemonset/fde-alloy --all-containers --prefix --tail=200 || true
          kubectl -n observability logs daemonset/fde-alloy --all-containers --prefix --previous --tail=200 || true
          kubectl -n observability logs --all-containers --prefix --tail=200 --selector=app.kubernetes.io/part-of=fde-observability || true

  infrastructure:
    name: Terraform and Helm validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate Terraform modules without remote state
        shell: bash
        run: |
          set -euo pipefail
          for module in \
            infra/terraform/bootstrap \
            infra/terraform/environments/demo \
            infra/terraform/environments/expiry \
            infra/terraform/environments/managed \
            infra/terraform/modules/demo \
            infra/terraform/modules/expiry \
            infra/terraform/modules/managed
          do
            terraform -chdir="$module" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$module" validate
          done
      - name: Execute mocked managed-profile plans
        run: terraform -chdir=infra/terraform/modules/managed test -no-color
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1
      - name: Lint and render chart
        run: |
          helm lint infra/helm/fde --strict
          helm template fde infra/helm/fde --namespace fde-staging > "$RUNNER_TEMP/fde-rendered.yaml"
          helm lint infra/helm/fde --strict --values infra/helm/fde/values-managed.example.yaml
          helm template fde-managed infra/helm/fde --namespace production \
            --values infra/helm/fde/values-managed.example.yaml > "$RUNNER_TEMP/fde-managed-rendered.yaml"
          helm lint observability/helm --strict
          helm template fde-observability observability/helm --namespace observability > "$RUNNER_TEMP/observability-rendered.yaml"
          awk '/^  config\.alloy: \|$/ {capture=1; next} capture && /^    / {sub(/^    /, ""); print; next} capture {exit}' \
            "$RUNNER_TEMP/observability-rendered.yaml" > "$RUNNER_TEMP/config.alloy"
          test -s "$RUNNER_TEMP/config.alloy"
      - name: Validate rendered Alloy configuration
        run: >-
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges
          --volume "$RUNNER_TEMP/config.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
          validate /etc/alloy/config.alloy
      - name: Validate rendered Kubernetes resources
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
          -strict -summary -ignore-missing-schemas \
          < "$RUNNER_TEMP/fde-rendered.yaml"
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
          -strict -summary -ignore-missing-schemas \
          < "$RUNNER_TEMP/fde-managed-rendered.yaml"
      - name: Validate rendered observability resources
        run: >-
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -ignore-missing-schemas
          < "$RUNNER_TEMP/observability-rendered.yaml"

  deployment-cli:
    name: Deployment CLI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Test deployment CLI
        run: uv run --project tooling/fde --with pytest pytest -q tooling/fde/tests
