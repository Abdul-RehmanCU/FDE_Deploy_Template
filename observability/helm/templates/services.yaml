apiVersion: v1
kind: Service
metadata: { name: fde-prometheus }
spec:
  selector: { app.kubernetes.io/name: fde-prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: fde-alertmanager }
spec:
  selector: { app.kubernetes.io/name: fde-alertmanager }
  ports: [{ name: http, port: 9093, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: fde-loki }
spec:
  selector: { app.kubernetes.io/name: fde-loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: fde-tempo }
spec:
  selector: { app.kubernetes.io/name: fde-tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: v1
kind: Service
metadata: { name: fde-otel-collector }
spec:
  selector: { app.kubernetes.io/name: fde-otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: metrics, port: 8889, targetPort: metrics }
---
apiVersion: v1
kind: Service
metadata: { name: fde-grafana }
spec:
  selector: { app.kubernetes.io/name: fde-grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
