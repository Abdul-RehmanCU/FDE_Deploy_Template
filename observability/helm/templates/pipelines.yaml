apiVersion: apps/v1
kind: Deployment
metadata: { name: fde-otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fde-otel-collector } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fde-otel-collector } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: {{ .Values.images.otelCollector }}
          args: ["--config=/etc/otel/collector.yml"]
          ports: [{ name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }, { name: metrics, containerPort: 8889 }]
          readinessProbe: { httpGet: { path: /, port: 13133 }, initialDelaySeconds: 5 }
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
          volumeMounts: [{ name: config, mountPath: /etc/otel/collector.yml, subPath: collector.yml, readOnly: true }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: config, configMap: { name: fde-otel-config } }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: fde-alloy }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: fde-alloy } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fde-alloy } }
    spec:
      serviceAccountName: fde-observability
      securityContext: { runAsNonRoot: true, runAsUser: 473, runAsGroup: 473, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: alloy
          image: {{ .Values.images.alloy }}
          args: ["run", "/etc/alloy/config.alloy", "--storage.path=/tmp/alloy"]
          env: [{ name: HOSTNAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }]
          ports: [{ name: http, containerPort: 12345 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/alloy/config.alloy, subPath: config.alloy, readOnly: true }
            - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
            - { name: data, mountPath: /tmp/alloy }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes:
        - { name: config, configMap: { name: fde-alloy-config } }
        - { name: pod-logs, hostPath: { path: /var/log/pods, type: Directory } }
        - { name: data, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fde-grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fde-grafana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fde-grafana } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: {{ .Values.images.grafana }}
          env:
            - { name: GF_SECURITY_ADMIN_USER, valueFrom: { secretKeyRef: { name: {{ .Values.grafanaAdminSecret }}, key: username } } }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.grafanaAdminSecret }}, key: password } } }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_SERVER_ROOT_URL, value: "http://localhost:3000" }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: http } }
          livenessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 20 }
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml, readOnly: true }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true }
            - { name: dashboard, mountPath: /var/lib/grafana/dashboards/fde-overview.json, subPath: fde-overview.json, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      volumes:
        - { name: provisioning, configMap: { name: fde-grafana-provisioning } }
        - { name: dashboard, configMap: { name: fde-grafana-dashboard } }
        - { name: data, emptyDir: {} }
