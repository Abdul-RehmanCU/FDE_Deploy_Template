apiVersion: apps/v1
kind: StatefulSet
metadata: { name: fde-prometheus }
spec:
  serviceName: fde-prometheus
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fde-prometheus } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fde-prometheus } }
    spec:
      serviceAccountName: fde-observability
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time={{ .Values.retention }}", "--web.enable-remote-write-receiver"]
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          livenessProbe: { httpGet: { path: /-/healthy, port: http } }
          resources: {{- toYaml .Values.resources.medium | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules/alerts.yml, subPath: alerts.yml, readOnly: true }
            - { name: data, mountPath: /prometheus }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes:
        - { name: config, configMap: { name: fde-prometheus-config, items: [{ key: prometheus.yml, path: prometheus.yml }] } }
        - { name: rules, configMap: { name: fde-prometheus-config, items: [{ key: alerts.yml, path: alerts.yml }] } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.predeclared }}
        storageClassName: ""
        volumeName: fde-observability-prometheus
        {{- end }}
        resources: { requests: { storage: {{ .Values.storage.prometheus }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fde-alertmanager }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fde-alertmanager } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fde-alertmanager } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: alertmanager
          image: {{ .Values.images.alertmanager }}
          args: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/tmp/alertmanager"]
          ports: [{ name: http, containerPort: 9093 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
          volumeMounts: [{ name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml, readOnly: true }, { name: data, mountPath: /tmp/alertmanager }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: config, configMap: { name: fde-alertmanager-config } }, { name: data, emptyDir: {} }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: fde-loki }
spec:
  serviceName: fde-loki
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fde-loki } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fde-loki } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: loki
          image: {{ .Values.images.loki }}
          args: ["-config.file=/etc/loki/loki.yml"]
          ports: [{ name: http, containerPort: 3100 }]
          readinessProbe: { httpGet: { path: /ready, port: http } }
          resources: {{- toYaml .Values.resources.medium | nindent 12 }}
          volumeMounts: [{ name: config, mountPath: /etc/loki/loki.yml, subPath: loki.yml, readOnly: true }, { name: data, mountPath: /var/loki }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: config, configMap: { name: fde-loki-config } }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.predeclared }}
        storageClassName: ""
        volumeName: fde-observability-loki
        {{- end }}
        resources: { requests: { storage: {{ .Values.storage.loki }} } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: fde-tempo }
spec:
  serviceName: fde-tempo
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fde-tempo } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fde-tempo } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: tempo
          image: {{ .Values.images.tempo }}
          args: ["-config.file=/etc/tempo/tempo.yml"]
          ports: [{ name: http, containerPort: 3200 }, { name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }]
          readinessProbe: { httpGet: { path: /ready, port: http } }
          resources: {{- toYaml .Values.resources.medium | nindent 12 }}
          volumeMounts: [{ name: config, mountPath: /etc/tempo/tempo.yml, subPath: tempo.yml, readOnly: true }, { name: data, mountPath: /var/tempo }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: config, configMap: { name: fde-tempo-config } }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.predeclared }}
        storageClassName: ""
        volumeName: fde-observability-tempo
        {{- end }}
        resources: { requests: { storage: {{ .Values.storage.tempo }} } }
